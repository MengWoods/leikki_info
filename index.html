<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e3439">
  <meta name="description" content="Family activities for ages 0-8 in Espoo, Helsinki and Vantaa, from today through next week.">
  <title>Leikki | Kids’ activities</title>
  <script>
    try { const t = localStorage.getItem('leikki-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --paper:#24292d; --surface:#2e3439; --raised:#394046; --line:#4a535b; --field:#2a3034;
      --ink:#f4f7f6; --muted:#c9d2ce; --green:#92e5c0; --tint:#2f4a42; --coral:#f2a78a;
      --accent:#2f8460; --on-accent:#fff; --star:#f4c463; --star-off:#555e66;
      --shadow:0 1px 2px #0003, 0 4px 14px #00000026; --warn-bg:#4f4038; --warn-ink:#f8d8c6;
      --free-bg:#2c3f37; --paid-bg:#45343b; --paid-line:#6a4b57;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --paper:#f5f7f5; --surface:#ffffff; --raised:#eef2ef; --line:#dbe2de; --field:#ffffff;
      --ink:#1f2b27; --muted:#5a6762; --green:#17745b; --tint:#e5f2ec; --coral:#b94935;
      --accent:#17745b; --on-accent:#fff; --star:#e2a40b; --star-off:#d4dbd7;
      --shadow:0 1px 2px #1f2b2712, 0 4px 14px #1f2b270d; --warn-bg:#fff1e8; --warn-ink:#843623;
      --free-bg:#ebf7f0; --paid-bg:#fdedf1; --paid-line:#f1c9d3;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:'DM Sans',system-ui,sans-serif; font-size:15px; line-height:1.5; }
    button,input,select { font:inherit; color:inherit; }
    button,select { cursor:pointer; }
    button,a,input,select { -webkit-tap-highlight-color:transparent; }
    a { color:var(--green); text-underline-offset:3px; }
    :focus-visible { outline:3px solid var(--coral); outline-offset:2px; }
    [hidden] { display:none !important; }
    .wrap { width:min(1180px, 100% - 40px); margin:auto; }
    .skip { position:absolute; left:16px; top:-70px; background:var(--surface); padding:10px; z-index:20; }
    .skip:focus { top:10px; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

    /* Header */
    header { background:var(--surface); border-bottom:1px solid var(--line); }
    .top { display:flex; justify-content:space-between; align-items:center; min-height:68px; gap:16px; }
    .brand { font-family:'Fraunces',serif; font-size:30px; line-height:1; color:var(--green); text-decoration:none; display:flex; align-items:baseline; gap:10px; }
    .brand small { font-family:'DM Sans',sans-serif; font-size:11px; letter-spacing:.06em; color:var(--muted); }
    .header-controls { display:flex; gap:8px; align-items:center; }
    .lang { position:relative; display:flex; align-items:center; }
    .lang svg { position:absolute; left:10px; pointer-events:none; color:var(--muted); }
    .lang .dd-btn { background:var(--raised); border:1px solid var(--line); border-radius:999px; padding:7px 30px 7px 32px; min-height:40px; font-size:14px; font-weight:600; }
    .lang::after { content:''; position:absolute; right:13px; width:6px; height:6px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:translateY(-2px) rotate(45deg); pointer-events:none; }
    .icon-btn { width:40px; height:40px; display:grid; place-items:center; border-radius:999px; border:1px solid var(--line); background:var(--raised); color:var(--ink); padding:0; }
    .icon-btn:hover, .lang .dd-btn:hover { border-color:var(--green); }
    .icon-sun { display:none; } :root[data-theme="dark"] .icon-sun { display:block; } :root[data-theme="dark"] .icon-moon { display:none; }

    /* Intro */
    .intro { padding:22px 0 18px; background:linear-gradient(110deg,var(--tint),var(--paper) 60%); }
    h1 { font-family:'Fraunces',serif; font-weight:500; font-size:32px; line-height:1.2; margin:0 0 4px; }
    .range { margin:0; color:var(--muted); }
    .status { font-size:12px; color:var(--muted); margin-top:6px; }
    .warning { color:var(--warn-ink); background:var(--warn-bg); border-left:3px solid var(--coral); padding:10px 14px; margin-top:14px; border-radius:4px; font-size:13px; }

    /* Sticky toolbar: days + filters + categories */
    .toolbar { position:sticky; top:0; z-index:10; background:var(--surface); border-top:1px solid var(--line); border-bottom:1px solid var(--line); transition:box-shadow .2s; }
    .toolbar.stuck { box-shadow:0 6px 18px #0000002a; }
    .days { position:relative; display:flex; gap:6px; overflow-x:auto; padding:10px 0 8px; scrollbar-width:none; }
    .days::-webkit-scrollbar { display:none; }
    .day-tab { flex:1 0 74px; display:flex; flex-direction:column; align-items:center; gap:1px; padding:6px 4px 7px; border-radius:10px; border:1px solid transparent; background:transparent; color:var(--muted); font-size:12px; position:relative; }
    .day-tab:hover { background:var(--raised); }
    .day-tab strong { font-size:19px; line-height:1.2; color:var(--ink); font-variant-numeric:tabular-nums; }
    .day-tab .count { font-size:11px; font-weight:700; color:var(--green); min-height:16px; }
    .day-tab.empty-day .count { color:var(--muted); font-weight:500; opacity:.7; }
    .day-tab[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#ffffffd9; }
    .day-tab[aria-selected="true"] strong, .day-tab[aria-selected="true"] .count { color:var(--on-accent); }
    .day-tab .today { font-weight:700; }
    .week-divider { flex:0 0 auto; align-self:stretch; display:flex; align-items:center; padding:0 2px; }
    .week-divider span { writing-mode:vertical-rl; transform:rotate(180deg); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border-left:1px solid var(--line); padding-left:6px; }

    .filters { display:flex; gap:8px; align-items:center; padding:2px 0 10px; overflow-x:auto; scrollbar-width:none; }
    .filters::-webkit-scrollbar { display:none; }
    .pill { position:relative; flex:0 0 auto; display:flex; align-items:center; }
    .pill::after { content:''; position:absolute; right:13px; width:6px; height:6px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:translateY(-2px) rotate(45deg); pointer-events:none; color:var(--muted); }
    .pill .dd-btn { background:var(--field); border:1px solid var(--line); border-radius:999px; padding:7px 32px 7px 14px; min-height:38px; font-size:14px; font-weight:600; color:var(--ink); }
    .pill .dd-btn:hover { border-color:var(--muted); }
    .pill.on .dd-btn { background:var(--tint); border-color:var(--green); color:var(--green); }
    .pill.on::after { color:var(--green); }
    .pill.sort { margin-left:auto; }
    .pill.sort .dd-btn { background:transparent; }
    .time-toggles { display:flex; gap:2px; flex:0 0 auto; padding:2px; background:var(--field); border:1px solid var(--line); border-radius:999px; }
    .time-chip { flex:1 0 auto; display:inline-flex; align-items:center; justify-content:center; gap:6px; background:transparent; border:1px solid transparent; border-radius:999px; padding:4px 12px; min-height:32px; font:inherit; font-size:14px; font-weight:600; color:var(--ink); cursor:pointer; white-space:nowrap; }
    .time-chip svg { flex:none; color:var(--muted); }
    .time-chip:hover { background:var(--raised); }
    .time-chip .n { font-weight:500; color:var(--muted); font-variant-numeric:tabular-nums; }
    .time-chip.zero:not([aria-pressed="true"]) { opacity:.55; }
    .time-chip[aria-pressed="true"] { background:var(--tint); border-color:var(--green); color:var(--green); }
    .time-chip[aria-pressed="true"] .n, .time-chip[aria-pressed="true"] svg { color:var(--green); }
    .reset { flex:0 0 auto; background:none; border:0; color:var(--green); text-decoration:underline; text-underline-offset:3px; font-size:13px; font-weight:600; padding:6px 4px; }

    .dd-btn { white-space:nowrap; cursor:pointer; }
    .dd-btn[aria-expanded="true"] { border-color:var(--green) !important; }
    .dd-menu { position:fixed; z-index:30; min-width:160px; max-width:calc(100vw - 16px); max-height:min(60vh, 420px); overflow:auto; padding:6px; margin:0; list-style:none;
      background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:0 12px 32px #00000059, 0 2px 6px #00000026;
      transform-origin:top left; animation:pop .14s ease-out; }
    .dd-menu[hidden] { display:none; }
    .dd-menu li { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:9px 12px; min-height:40px; border-radius:9px; font-size:14px; cursor:pointer; color:var(--ink); white-space:nowrap; outline:none; }
    .dd-menu li:hover, .dd-menu li:focus-visible { background:var(--raised); }
    .dd-menu li[aria-selected="true"] { color:var(--green); font-weight:700; }
    .dd-menu li[aria-selected="true"]::after { content:''; width:5px; height:10px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(45deg) translate(-2px,-2px); flex:0 0 auto; }
    .dd-menu .dd-title { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:6px 12px 4px; font-weight:700; }
    @keyframes pop { from { opacity:0; transform:scale(.97) translateY(-4px); } to { opacity:1; transform:none; } }
    @media (max-width:600px) { .dd-menu li { min-height:44px; font-size:15px; } }

    /* Day results */
    main { padding-bottom:40px; }
    .day-heading { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; padding:22px 0 14px; }
    h2 { font-family:'Fraunces',serif; font-weight:500; font-size:26px; margin:0; }
    .day-heading .meta { font-size:13px; color:var(--muted); }
    .cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; align-items:start; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; min-width:0; box-shadow:var(--shadow); animation:arrive .25s ease-out both; transition:border-color .15s, transform .15s; }
    .card:hover { border-color:var(--green); }
    .card[data-url] { cursor:pointer; }
    .card.free { background:var(--free-bg); }
    .card.paid { background:var(--paid-bg); border-color:var(--paid-line); }
    .card.paid:hover { border-color:var(--coral); }
    .card.saved { border-color:var(--star); box-shadow:var(--shadow), inset 0 0 0 1px var(--star); }
    h3 a { color:inherit; text-decoration:none; }
    .card:hover h3 a, h3 a:focus-visible { text-decoration:underline; text-decoration-color:var(--green); }
    .card-actions { display:flex; align-items:center; gap:6px; }
    .dislike { width:36px; height:36px; margin:-6px 0; display:grid; place-items:center; border:0; border-radius:999px; background:transparent; color:var(--muted); padding:0; }
    .dislike:hover { background:var(--raised); color:var(--ink); }
    .dislike[aria-pressed="true"] { color:var(--coral); }
    .dislike[aria-pressed="true"] svg { fill:currentColor; }
    .card.disliked { opacity:.6; }
    .card.disliked:hover { opacity:1; }
    .disliked-section { margin-top:24px; border-top:1px solid var(--line); padding-top:6px; }
    .disliked-section > summary { cursor:pointer; padding:10px 0; font-size:14px; font-weight:600; color:var(--muted); }
    .disliked-section > summary:hover { color:var(--ink); }
    .disliked-section .cards { margin-top:6px; }
    .save { width:36px; height:36px; margin:-6px -8px -6px 0; display:grid; place-items:center; border:0; border-radius:999px; background:transparent; color:var(--muted); padding:0; }
    .save:hover { background:var(--raised); color:var(--ink); }
    .save[aria-pressed="true"] { color:var(--star); }
    .save[aria-pressed="true"] svg { fill:currentColor; }
    .photo { width:100%; aspect-ratio:16/7; object-fit:cover; display:block; }
    .credit { font-size:10px; color:var(--muted); padding:3px 14px 0; margin:0; }
    .card-body { padding:16px 18px 14px; }
    .card-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .time { font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
    .time small { font-weight:500; color:var(--muted); font-size:12px; margin-left:4px; }
    .stars { position:relative; display:inline-block; font-size:16px; line-height:1; letter-spacing:1px; color:var(--star-off); white-space:nowrap; }
    .stars span { position:absolute; inset:0 auto 0 0; overflow:hidden; color:var(--star); }
    h3 { font-size:17px; line-height:1.35; margin:10px 0 6px; overflow-wrap:anywhere; }
    .orig-note { font-size:11px; color:var(--muted); display:block; margin:-4px 0 6px; }
    .venue { margin:0; font-weight:600; font-size:13px; }
    .address { font-size:12px; color:var(--muted); margin:2px 0 0; overflow-wrap:anywhere; }
    .tags { display:flex; flex-wrap:wrap; gap:5px; margin:12px 0; }
    .tag { font-size:11px; border:1px solid var(--line); padding:2px 8px; border-radius:999px; color:var(--muted); }
    .tag.free { background:var(--tint); color:var(--green); border-color:var(--green); font-weight:700; }
    .tag.caution { color:var(--coral); }
    .tag.paid { background:var(--surface); color:var(--ink); border-color:var(--paid-line); font-weight:700; }
    .tag.city { color:var(--ink); }
    .dir-group h4 { margin:18px 0 0; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
    details { font-size:12px; color:var(--muted); }
    details + details { margin-top:6px; }
    summary { cursor:pointer; font-weight:600; }
    summary:hover { color:var(--ink); }
    details p { white-space:pre-line; overflow-wrap:anywhere; max-height:230px; overflow:auto; margin:8px 0; }
    details ul { padding-left:18px; margin:8px 0; }
    .card-footer { display:flex; justify-content:flex-end; align-items:center; flex-wrap:wrap; gap:10px; border-top:1px solid var(--line); margin-top:14px; padding-top:12px; font-size:13px; }
    .empty { color:var(--muted); padding:28px 0; margin:0; font-size:14px; text-align:center; }
    .empty button { display:block; margin:12px auto 0; }
    .pager { display:flex; justify-content:space-between; gap:10px; margin-top:24px; }
    .btn { background:var(--surface); border:1px solid var(--line); color:var(--green); border-radius:8px; padding:9px 14px; min-height:42px; font-weight:600; }
    .btn:hover { border-color:var(--green); }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
    .notice { color:var(--muted); font-size:12px; margin:28px 0 0; }
    .directory { padding:22px 0 0; border-top:1px solid var(--line); margin-top:24px; }
    .directory > summary { font-family:'Fraunces',serif; color:var(--ink); font-size:20px; font-weight:500; }
    .directory > p { color:var(--muted); font-size:13px; }
    .source-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 24px; }
    .source-item { border-bottom:1px solid var(--line); padding:14px 0; min-width:0; }
    .source-item a { font-weight:600; font-size:14px; }
    .source-item small { display:block; color:var(--muted); font-size:12px; margin-top:4px; }
    footer { border-top:1px solid var(--line); padding:20px 0 30px; color:var(--muted); font-size:12px; background:var(--surface); }
    footer .wrap { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .error { padding:35px 0; text-align:center; }

    /* Floating back-to-top */
    .back-top { position:fixed; right:20px; bottom:20px; z-index:15; width:48px; height:48px; border-radius:999px; border:0; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; box-shadow:0 4px 16px #0004; opacity:0; transform:translateY(12px); pointer-events:none; transition:opacity .2s, transform .2s; }
    .back-top.show { opacity:1; transform:none; pointer-events:auto; }
    .back-top:hover { filter:brightness(1.1); }

    @keyframes arrive { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } .card { animation:none; } .back-top,.toolbar { transition:none; } }
    @media (max-width:960px) {
      .cards,.source-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:600px) {
      .wrap { width:calc(100% - 32px); }
      .top { min-height:52px; }
      .brand { font-size:24px; }
      .brand small { display:none; }
      .lang .dd-btn { min-height:34px; padding:4px 26px 4px 30px; font-size:13px; }
      .icon-btn { width:34px; height:34px; }
      .intro { padding:18px 0 16px; background:var(--paper); }
      .intro .wrap { display:block; }
      h1 { display:block; font-size:26px; margin-bottom:8px; }
      .range { font-size:14px; font-weight:600; color:var(--ink); }
      .status { font-size:12px; margin-top:6px; }
      .warning { flex-basis:100%; margin-top:6px; padding:6px 10px; font-size:12px; }
      .days { gap:2px; padding:6px 0 4px; }
      .day-tab { padding:4px 2px 5px; font-size:11px; border-radius:8px; }
      .day-tab .count { font-size:10px; min-height:14px; }
      /* Phone: filters wrap into compact rows - no sideways scrolling */
      .filters { flex-wrap:wrap; overflow:visible; padding:2px 0 8px; gap:6px; }
      .pill { flex:1 1 auto; min-width:0; }
      .pill .dd-btn { width:100%; min-height:34px; padding:5px 26px 5px 11px; font-size:13px; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .pill::after { right:11px; }
      .pill.sort { margin-left:0; }
      .pill.sort .dd-btn { background:var(--field); }
      .time-toggles { flex:1 1 auto; }
      .time-chip { min-height:28px; padding:3px 8px; gap:4px; font-size:13px; }
      .time-chip .lbl { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
      .reset { flex:0 0 auto; }
      .days { -webkit-mask-image:linear-gradient(to right,#000 88%,transparent); mask-image:linear-gradient(to right,#000 88%,transparent); }
      .day-heading { padding:14px 0 10px; }
      .cards { gap:12px; }
      .card-body { padding:14px 14px 12px; }
      .tags { margin:10px 0; }
      .card-footer { margin-top:10px; padding-top:10px; }
      .cards,.source-grid { grid-template-columns:minmax(0,1fr); }
      .day-tab { flex-basis:54px; }
      .day-tab strong { font-size:17px; }
      h2 { font-size:22px; }
      .back-top { right:16px; bottom:16px; }
    }
  </style>
</head>
<body>
  <a href="#main" class="skip" data-i18n="skip">Skip to activities</a>
  <header>
    <div class="wrap top">
      <a class="brand" href="./">Leikki<small data-i18n="brand">ESPOO · HELSINKI · VANTAA · AGES 0-8</small></a>
      <div class="header-controls">
        <div class="lang">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
          <select id="language" hidden data-label="languageLabel"><option value="en" lang="en">English</option><option value="fi" lang="fi">Suomi</option></select>
        </div>
        <button type="button" class="icon-btn" id="theme" aria-label="Switch to day mode" title="Switch to day mode">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <section class="intro">
    <div class="wrap">
      <h1 data-i18n="heading">Things to do with little ones</h1>
      <p class="range" id="range" data-i18n="loading">Loading activities...</p>
      <div class="status" id="status" aria-live="polite"></div>
      <div id="warning" class="warning" hidden></div>
    </div>
  </section>

  <div class="toolbar" id="toolbar">
    <div class="wrap">
      <div class="days" id="days" role="tablist" aria-label="Days"></div>
      <div class="filters" id="filters" role="group" aria-label="Filters">
        <div class="pill"><select id="age" hidden data-label="age"></select></div>
        <div class="pill"><select id="city" hidden data-label="city"></select></div>
        <div class="time-toggles" id="times" role="group"></div>
        <div class="pill"><select id="price" hidden data-label="priceLabel"></select></div>
        <div class="pill"><select id="category" hidden data-label="activityType"></select></div>
        <button type="button" class="reset" id="reset" hidden data-i18n="reset">Clear</button>
        <div class="pill sort"><select id="sort" hidden data-label="sort"></select></div>
      </div>
    </div>
  </div>

  <main class="wrap" id="main" tabindex="-1">
    <div id="results" aria-live="polite"><p class="empty" data-i18n="loading">Loading activities...</p></div>
    <p class="notice" data-i18n="check"></p>

    function enhance(select) {
      const btn = document.createElement('button');

      select.after(btn); select.ddButton = btn;

    }
    function openMenu(select) {
      closeMenu(false);
      openSelect = select;
      const btn = select.ddButton;
      btn.setAttribute('aria-expanded', 'true');
      menu.setAttribute('aria-label', t(select.dataset.label));
      menu.innerHTML = `<div class="dd-title" aria-hidden="true">${escape(t(select.dataset.label))}</div>` + [...select.options].map((o, i) =>
        `<li role="option" tabindex="-1" data-index="${i}" aria-selected="${o.selected}"${o.lang ? ` lang="${o.lang}"` : ''}>${escape(o.textContent)}</li>`).join('');
      menu.hidden = false;
      const r = btn.getBoundingClientRect();
      menu.style.minWidth = Math.max(160, r.width) + 'px';
      const w = menu.offsetWidth, h = menu.offsetHeight;
      const below = innerHeight - r.bottom - 8;
      menu.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';

      closeMenu(true);

    }
    menu.addEventListener('click', e => { const li = e.target.closest('li'); if (li) choose(li); });
    menu.addEventListener('keydown', e => {
      const items = [...menu.querySelectorAll('li')], i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); items[Math.min(i + 1, items.length - 1)].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); items[Math.max(i - 1, 0)].focus(); }
      else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }

      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (i >= 0) choose(items[i]); }

      else if (e.key === 'Tab') closeMenu(false);

      if (age.min !== null || age.max !== null) {

      return age.confirmed ? t('allAge') : t('unspecifiedAge');

    function card(a) {

      const url = a.sourceUrls[language] || a.sourceUrls.fi || a.sourceUrls.en;
      const isSaved = bookmarks.has(a.id), isDisliked = dislikes.has(a.id);
      const extra = a.registrationUrl ? link(a.registrationUrl, t('register')) : pr.url ? link(pr.url, t('tickets')) : '';
      return `<article class="card ${pr.status === 'free' ? 'free' : pr.status === 'paid' ? 'paid' : ''}${isSaved ? ' saved' : ''}${isDisliked ? ' disliked' : ''}"${url ? ` data-url="${escape(url)}"` : ''}>${photo}<div class="card-body">
        <div class="card-top"><span class="time">${escape(hm(a.start))}${sameDayEnd ? ` – ${escape(hm(a.end))}` : ''}${duration ? `<small>${escape(duration)}</small>` : ''}</span><span class="card-actions">${stars(a.score.value)}<button type="button" class="dislike" data-dislike="${escape(a.id)}" aria-pressed="${isDisliked}" aria-label="${escape(t(isDisliked ? 'undislike' : 'dislike'))}" title="${escape(t(isDisliked ? 'undislike' : 'dislike'))}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M17 14V3H7.5a2 2 0 0 0-2 1.6l-1.4 7A2 2 0 0 0 6 14h4.5l-1 4.4A2 2 0 0 0 11.4 21L17 14z"/><path d="M17 3h3v11h-3"/></svg></button><button type="button" class="save" data-save="${escape(a.id)}" aria-pressed="${isSaved}" aria-label="${escape(t(isSaved ? 'unsave' : 'save'))}" title="${escape(t(isSaved ? 'unsave' : 'save'))}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg></button></span></div>
        <h3 lang="${titleLang}">${url ? link(url, text(a.title)) : escape(text(a.title))}</h3>${language !== titleLang ? `<small class="orig-note">${escape(t('finnishText'))}</small>` : ''}
        <p class="venue">${escape(text(a.venue))}</p><p class="address">${escape(text(a.address))}</p>
        <div class="tags">${priceTag}<span class="tag city">${escape(t(a.city + 'City'))}</span><span class="tag">${escape(t(a.category))}</span><span class="tag${a.ages.confirmed ? '' : ' caution'}">${escape(ageLabel(a.ages))}</span>${a.environment !== 'unknown' ? `<span class="tag">${escape(t(a.environment))}</span>` : ''}${a.stale ? `<span class="tag caution">${escape(t('outdated'))}</span>` : ''}</div>
        <details><summary>${escape(t('moreInfo'))}</summary>${description ? `<p lang="${descLang}">${escape(description)}</p>` : ''}<p>${escape(t('language'))}: ${escape(a.languages.length ? a.languages.join(', ').toUpperCase() : t('notGiven'))}${pr.status === 'paid' && priceText ? `<br>${escape(t('priceLabel'))}: ${escape(priceText)}` : ''}</p></details>
        <details><summary>${escape(t('whyRating'))}</summary><ul>${a.score.reasons.map(r => `<li>+${r.points}: ${escape(t(r.key))}</li>`).join('')}</ul><p>${escape(t('ratingNote'))}</p></details>
        ${extra ? `<div class="card-footer">${extra}</div>` : ''}
      </div></article>`;
    }

    /* ---------- Filtering ---------- */
    // Time-of-day bucket by start hour in Helsinki time
    function slotOf(a) {
      const h = Number(new Intl.DateTimeFormat('en-GB', { timeZone:'Europe/Helsinki', hour:'2-digit', hourCycle:'h23' }).format(new Date(a.start)));
      return h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
    }
    function matchesFilters(a, { ignoreCategory = false, ignoreTime = false } = {}) {
      const city = get('city').value, price = get('price').value, age = get('age').value;
      return (city === 'all' || a.city === city)
        && (price === 'all' || (a.price?.status ?? 'free') === price)
        && (ignoreCategory || category === 'all' || a.category === category)
        && (ignoreTime || times.size === 0 || times.has(slotOf(a)))
        && (age === 'all' || ((a.ages.min === null || a.ages.min <= +age) && (a.ages.max === null || a.ages.max >= +age)));
    }
    const activeFilterCount = () => ['city','price','age'].filter(id => get(id).value !== 'all').length + (category !== 'all') + (times.size > 0);
    function resetFilters() {
      ['city','price','age'].forEach(id => { get(id).value = 'all'; store.set('leikki-' + id, 'all'); }); category = 'all'; times.clear(); saveTimes(); render();
    }

    /* ---------- Render ---------- */
    let visibleDays = [], dislikedOpen = false;
    function render() { renderView(); syncDropdowns(); }
    function renderView() {
      if (!data) {
        if (loadFailed) { get('results').innerHTML = `<div class="error"><p>${escape(t('error'))}</p><button type="button" class="btn primary" id="retry">${escape(t('retry'))}</button></div>`; get('retry').onclick = load; }
        return;
      }
      const now = new Date(), todayISO = formatISO(now);
      const nextMondayISO = addDays(todayISO, 8 - (new Date(noon(todayISO)).getUTCDay() || 7));
      const requiredEndISO = addDays(nextMondayISO, 7);
      visibleDays = data.week.days.filter(d => d >= todayISO && d < requiredEndISO);
      if (!visibleDays.includes(selectedDate)) selectedDate = visibleDays[0] ?? null;

      const first = visibleDays[0] ?? data.week.start, last = visibleDays.at(-1) ?? data.week.days.at(-1);
      get('range').textContent = `${format(noon(first),{day:'numeric',month:'long'})} – ${format(noon(last),{day:'numeric',month:'long',year:'numeric'})}`;
      get('status').textContent = `${t('updated')}: ${format(data.generatedAt,{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',timeZoneName:'short'})} (Europe/Helsinki)`;
      const warnings = [
        data.week.end < requiredEndISO || data.week.start > todayISO ? t('dateWarning') : '',
        now - new Date(data.generatedAt) > 36 * 3600000 ? t('stale') : '',
        data.sources.some(s => s.status !== 'ok') ? t('failed') : ''
      ].filter(Boolean);
      get('warning').hidden = !warnings.length; get('warning').textContent = warnings.join(' ');

      const filtered = data.activities.filter(a => visibleDays.includes(a.date) && matchesFilters(a));

      // Day tabs
      get('days').innerHTML = visibleDays.map(date => {
        const count = filtered.filter(a => a.date === date && !dislikes.has(a.id)).length;
        const divider = date === nextMondayISO && date !== visibleDays[0] ? `<div class="week-divider" aria-hidden="true"><span>${escape(t('nextWeek'))}</span></div>` : '';
        const selected = date === selectedDate;
        return `${divider}<button type="button" role="tab" class="day-tab${count ? '' : ' empty-day'}" data-date="${date}" aria-selected="${selected}" tabindex="${selected ? 0 : -1}" aria-controls="results">
          <span class="${date === todayISO ? 'today' : ''}">${escape(date === todayISO ? t('today') : format(noon(date),{weekday:'short'}))}</span>
          <strong>${Number(date.slice(-2))}</strong><span class="count">${count}</span></button>`;
      }).join('');
      const tab = get('days').querySelector('[aria-selected="true"]');
      if (tab) { const strip = get('days'); const left = tab.offsetLeft, right = left + tab.offsetWidth; if (left < strip.scrollLeft || right > strip.scrollLeft + strip.clientWidth) strip.scrollLeft = left - (strip.clientWidth - tab.offsetWidth) / 2; }

      // Activity-type options with counts for the selected day
      const dayAll = data.activities.filter(a => a.date === selectedDate && !dislikes.has(a.id) && matchesFilters(a, { ignoreCategory:true }));
      // Time-of-day chips with counts for the selected day
      const dayAnyTime = data.activities.filter(a => a.date === selectedDate && !dislikes.has(a.id) && matchesFilters(a, { ignoreTime:true }));
      get('times').setAttribute('aria-label', t('timeOfDay'));
      get('times').innerHTML = slots.map(s => {
        const count = dayAnyTime.filter(a => slotOf(a) === s).length;
        return `<button type="button" class="time-chip${count ? '' : ' zero'}" data-time="${s}" aria-pressed="${times.has(s)}" title="${escape(t(s) + ': ' + t(s + 'Hours'))}">${timeIcons[s]}<span class="lbl">${escape(t(s))}</span><span class="n">${count}</span></button>`;
      }).join('');
      get('category').innerHTML = categories.map(c => {
        const count = c === 'all' ? dayAll.length : dayAll.filter(a => a.category === c).length;
        return `<option value="${c}">${escape(t(c === 'all' ? 'allActivities' : c))} (${count})</option>`;
      }).join('');
      get('category').value = category;
      ['age','category','city','price'].forEach(id => get(id).parentElement.classList.toggle('on', get(id).value !== 'all'));
      const n = activeFilterCount();
      get('reset').hidden = !n;

      // Results for selected day
      if (!selectedDate) { get('results').innerHTML = `<p class="empty">${escape(t('noEvents'))}</p>`; return; }
      const all = filtered.filter(a => a.date === selectedDate)
        .sort((x, y) => (bookmarks.has(y.id) - bookmarks.has(x.id)) || (get('sort').value === 'score' ? y.score.value - x.score.value : 0) || x.start.localeCompare(y.start));
      const day = all.filter(a => !dislikes.has(a.id)), hidden = all.filter(a => dislikes.has(a.id));
      const anyThatDay = data.activities.some(a => a.date === selectedDate);
      const idx = visibleDays.indexOf(selectedDate);
      const prev = visibleDays[idx - 1], next = visibleDays[idx + 1];
      get('results').innerHTML = `<div class="day-heading"><h2>${escape(format(noon(selectedDate),{weekday:'long',day:'numeric',month:'long'}))}</h2><span class="meta">${day.length} ${escape(t(day.length === 1 ? 'activity' : 'activities'))}</span></div>`
        + (day.length ? `<div class="cards">${day.map(card).join('')}</div>`
          : `<div class="empty"><p>${escape(t(anyThatDay ? 'noResults' : 'noEvents'))}</p>${anyThatDay && n ? `<button type="button" class="btn" data-reset>${escape(t('reset'))}</button>` : ''}</div>`)
        + (hidden.length ? `<details class="disliked-section"${dislikedOpen ? ' open' : ''}><summary>${escape(t('dislikedSection', hidden.length))}</summary><div class="cards">${hidden.map(card).join('')}</div></details>` : '')
        + `<nav class="pager" aria-label="${escape(t('days'))}">${prev ? `<button type="button" class="btn" data-go="${prev}">← ${escape(format(noon(prev),{weekday:'short',day:'numeric',month:'numeric'}))}</button>` : '<span></span>'}${next ? `<button type="button" class="btn" data-go="${next}">${escape(format(noon(next),{weekday:'short',day:'numeric',month:'numeric'}))} →</button>` : ''}</nav>`;
      document.querySelectorAll('.photo').forEach(img => img.addEventListener('error', () => { img.nextElementSibling?.remove(); img.remove(); }, { once:true }));
    }

    function selectDay(date, { focus = false } = {}) {
      if (!date || date === selectedDate) return;
      selectedDate = date;
      try { history.replaceState(null, '', '#' + date); } catch {}
      render();
      if (focus) get('days').querySelector(`[data-date="${date}"]`)?.focus();
      // Keep the toolbar in place and bring the list start into view
      const intro = document.querySelector('.intro');
      const anchor = intro.offsetTop + intro.offsetHeight;
      if (window.scrollY > anchor) window.scrollTo({ top: anchor, behavior:'instant' });
    }

    async function load() {
      loadFailed = false;
      get('results').innerHTML = `<p class="empty">${escape(t('loading'))}</p>`;
      try {
        const response = await fetch('./data/activities.json', { cache:'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        if (payload.schemaVersion !== 3 || payload.week?.days?.length < 8 || payload.week.days.length > 14 || !Array.isArray(payload.activities)) throw new Error('Invalid snapshot');
        data = payload;
        const ids = new Set(payload.activities.map(a => a.id));
        bookmarks.forEach(id => { if (!ids.has(id)) bookmarks.delete(id); }); saveBookmarks();
        dislikes.forEach(id => { if (!ids.has(id)) dislikes.delete(id); }); saveDislikes();
        const hash = location.hash.slice(1);
        if (/^\d{4}-\d{2}-\d{2}$/.test(hash)) selectedDate = hash;
      } catch { loadFailed = true; }
      render();
    }

    /* ---------- Events ---------- */
    get('language').addEventListener('change', e => { language = e.target.value; store.set('leikki-language', language); buildControls(); render(); });
    get('theme').addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; store.set('leikki-theme', theme); applyTheme(); });
    get('sort').addEventListener('change', render);
    get('category').addEventListener('change', e => { category = e.target.value; render(); });
    get('reset').addEventListener('click', resetFilters);
    get('times').addEventListener('click', e => {
      const b = e.target.closest('[data-time]'); if (!b) return;
      const s = b.dataset.time;
      times.has(s) ? times.delete(s) : times.add(s);
      saveTimes(); render();
      get('times').querySelector(`[data-time="${s}"]`)?.focus({ preventScroll:true });
    });
    ['age','city','price'].forEach(id => get(id).addEventListener('change', e => { store.set('leikki-' + id, e.target.value); render(); }));
    get('days').addEventListener('click', e => { const b = e.target.closest('[data-date]'); if (b) selectDay(b.dataset.date); });
    get('days').addEventListener('keydown', e => {
      const i = visibleDays.indexOf(selectedDate);
      const target = { ArrowRight: visibleDays[i + 1], ArrowLeft: visibleDays[i - 1], Home: visibleDays[0], End: visibleDays.at(-1) }[e.key];
      if (target) { e.preventDefault(); selectDay(target, { focus:true }); }
    });
    get('results').addEventListener('click', e => {
      const go = e.target.closest('[data-go]'); if (go) return selectDay(go.dataset.go);
      if (e.target.closest('[data-reset]')) return resetFilters();
      const dis = e.target.closest('[data-dislike]');
      if (dis) {
        const id = dis.dataset.dislike;
        if (dislikes.has(id)) dislikes.delete(id); else { dislikes.add(id); if (bookmarks.delete(id)) saveBookmarks(); }
        saveDislikes(); render();
        return;
      }
      const save = e.target.closest('[data-save]');
      if (save) {
        const id = save.dataset.save;
        bookmarks.has(id) ? bookmarks.delete(id) : bookmarks.add(id);
        if (bookmarks.has(id) && dislikes.delete(id)) saveDislikes();
        saveBookmarks(); render();
        return [...get('results').querySelectorAll('[data-save]')].find(b => b.dataset.save === id)?.focus({ preventScroll:true });
      }
      const c = e.target.closest('.card[data-url]');
      if (!c || e.target.closest('a,button,details,input,select') || String(getSelection?.() ?? '')) return;
      window.open(c.dataset.url, '_blank', 'noopener,noreferrer');
    });
    get('results').addEventListener('toggle', e => { if (e.target.matches('.disliked-section')) dislikedOpen = e.target.open; }, true);
    const backTop = get('back-top');
    backTop.addEventListener('click', () => window.scrollTo({ top:0 }));
    const onScroll = () => {
      backTop.classList.toggle('show', window.scrollY > 500);
      get('toolbar').classList.toggle('stuck', get('toolbar').getBoundingClientRect().top <= 0 && window.scrollY > 0);
    };
    window.addEventListener('scroll', onScroll, { passive:true });
    window.addEventListener('scroll', () => closeMenu(false), { passive:true });
    get('filters').addEventListener('scroll', () => closeMenu(false), { passive:true });

    buildControls(); onScroll(); render(); load();
  </script>
</body>
</html>
