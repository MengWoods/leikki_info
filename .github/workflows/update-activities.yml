name: Update family activities
on:
  schedule:
    - cron: '0 1 * * *'
      timezone: 'Europe/Helsinki'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-activities
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run update
      - name: Publish snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/activities.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update family activity calendar'
            git push
          fi
      - name: Report source health
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const data=JSON.parse(fs.readFileSync("data/activities.json","utf8")); for(const source of data.sources) { fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${source.name}: ${source.status}, ${source.count} activities\n\n`); } if(data.sources.some(source=>source.status!=="ok")) process.exitCode=1;'
